name: Sabuflix Multiplatform Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub --reporter expanded
      - run: flutter build web --release --no-pub

  # Builds land as release assets instead of workflow-run artifacts: Actions
  # artifact storage is a separate, much smaller quota from Releases storage,
  # and it fills up fast with binaries this size. This job just reserves the
  # release so both platform jobs have somewhere to upload to.
  create-release:
    needs: validate
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: write
    name: Create GitHub Release
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.release.outputs.tag_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine release tag
        id: release
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          SAFE_BRANCH=$(printf '%s' "$REF_NAME" | tr -c 'a-zA-Z0-9._-' '-')
          TAG="build-${SAFE_BRANCH}-${{ github.run_number }}"
          echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.release.outputs.tag_name }}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $TAG already exists, reusing it (re-run of this workflow run)."
            exit 0
          fi

          PRERELEASE_FLAG=""
          if [ "${{ github.ref_name }}" != "main" ] && [ "${{ github.ref_name }}" != "master" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          gh release create "$TAG" --draft \
            --repo "${{ github.repository }}" \
            --title "Sabuflix build #${{ github.run_number }} (${{ github.ref_name }})" \
            --notes "Automated multiplatform build from commit ${{ github.sha }} on branch \`${{ github.ref_name }}\`." \
            --target "${{ github.sha }}" \
            $PRERELEASE_FLAG

  build-windows:
    name: Build Windows Executable (.exe)
    runs-on: windows-latest
    needs: create-release
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Enable Windows desktop build
        run: flutter config --enable-windows-desktop

      - name: Build Windows Release
        run: flutter build windows --release --dart-define=PENGUPLAY_MANIFEST_URL=${{ secrets.PENGUPLAY_MANIFEST_URL }}

      - name: Install Packaging Tools (Inno Setup & 7-Zip)
        run: |
          choco install innosetup 7zip.install --no-progress -y

      - name: Package Windows Executables
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path dist

          # 1. Create Inno Setup Single File Installer (.exe)
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" windows/installer.iss

          # 2. Create Zip Bundle
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath dist\sabuflix-windows-bundle.zip

          # 3. Create Self-Extracting Single Executable (.exe)
          $sfxConfig = ";!@Install@!UTF-8!`nTitle=`"Sabuflix`"`nRunProgram=`"sabuflix.exe`"`n;!@InstallEnd@!"
          Set-Content -Path config.txt -Value $sfxConfig -Encoding UTF8
          & "C:\Program Files\7-Zip\7z.exe" a release.7z .\build\windows\x64\runner\Release\*
          cmd /c "copy /b `"C:\Program Files\7-Zip\7z.sfx`" + config.txt + release.7z dist\sabuflix.exe"

      - name: Upload Windows builds to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.create-release.outputs.tag_name }}" \
            --repo "${{ github.repository }}" \
            --clobber \
            dist/sabuflix.exe \
            dist/sabuflix-installer.exe \
            dist/sabuflix-windows-bundle.zip

  build-android:
    name: Build Android Package (.apk)
    runs-on: ubuntu-latest
    needs: create-release
    permissions:
      contents: write
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

    steps:
      - name: Checkout repository
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          cache: true

      - name: Install dependencies
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: flutter pub get --enforce-lockfile

      - name: Restore signing key
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ env.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Missing ANDROID_KEYSTORE_BASE64"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build Android Release APK
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release --no-tree-shake-icons --dart-define=PENGUPLAY_MANIFEST_URL=${{ secrets.PENGUPLAY_MANIFEST_URL }}

      - name: Prepare Android APK Artifact
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/sabuflix.apk

      - name: Upload Android APK to release
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.create-release.outputs.tag_name }}" \
            --repo "${{ github.repository }}" \
            --clobber \
            dist/sabuflix.apk

      - name: Report unavailable Android signing
        if: env.ANDROID_KEYSTORE_BASE64 == ''
        run: echo "Android omitted because production signing secrets are not configured."

  build-web:
    name: Build Web Bundle
    runs-on: ubuntu-latest
    needs: create-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Build Web Release
        run: flutter build web --release --no-pub --dart-define=PENGUPLAY_MANIFEST_URL=${{ secrets.PENGUPLAY_MANIFEST_URL }}
      - name: Package and upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd build/web
          zip -qr ../../sabuflix-web.zip .
          cd ../..
          gh release upload "${{ needs.create-release.outputs.tag_name }}" sabuflix-web.zip \
            --repo "${{ github.repository }}" --clobber

  publish-release:
    needs: [create-release, build-windows, build-android, build-web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.create-release.outputs.tag_name }}
          REPOSITORY: ${{ github.repository }}
        run: gh release edit "$TAG" --repo "$REPOSITORY" --draft=false
