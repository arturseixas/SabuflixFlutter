name: Sabuflix Multiplatform Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# Needed so the default GITHUB_TOKEN can create a release and upload assets
# to it (gh release create / gh release upload).
permissions:
  contents: write

jobs:
  # Builds land as release assets instead of workflow-run artifacts: Actions
  # artifact storage is a separate, much smaller quota from Releases storage,
  # and it fills up fast with binaries this size. This job just reserves the
  # release so both platform jobs have somewhere to upload to.
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.release.outputs.tag_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine release tag
        id: release
        shell: bash
        run: |
          SAFE_BRANCH=$(echo "${{ github.ref_name }}" | tr -c 'a-zA-Z0-9._-' '-')
          TAG="build-${SAFE_BRANCH}-${{ github.run_number }}"
          echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.release.outputs.tag_name }}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $TAG already exists, reusing it (re-run of this workflow run)."
            exit 0
          fi

          PRERELEASE_FLAG=""
          if [ "${{ github.ref_name }}" != "main" ] && [ "${{ github.ref_name }}" != "master" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "Sabuflix build #${{ github.run_number }} (${{ github.ref_name }})" \
            --notes "Automated multiplatform build from commit ${{ github.sha }} on branch \`${{ github.ref_name }}\`." \
            --target "${{ github.sha }}" \
            $PRERELEASE_FLAG

  build-windows:
    name: Build Windows Executable (.exe)
    runs-on: windows-latest
    needs: create-release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Enable Windows desktop build
        run: flutter config --enable-windows-desktop

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Install Packaging Tools (Inno Setup & 7-Zip)
        run: |
          choco install innosetup 7zip.install --no-progress -y

      - name: Package Windows Executables
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path dist

          # 1. Create Inno Setup Single File Installer (.exe)
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" windows/installer.iss

          # 2. Create Zip Bundle
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath dist\sabuflix-windows-bundle.zip

          # 3. Create Self-Extracting Single Executable (.exe)
          $sfxConfig = ";!@Install@!UTF-8!`nTitle=`"Sabuflix`"`nRunProgram=`"sabuflix.exe`"`n;!@InstallEnd@!"
          Set-Content -Path config.txt -Value $sfxConfig -Encoding UTF8
          & "C:\Program Files\7-Zip\7z.exe" a release.7z .\build\windows\x64\runner\Release\*
          cmd /c "copy /b `"C:\Program Files\7-Zip\7z.sfx`" + config.txt + release.7z dist\sabuflix.exe"

      - name: Upload Windows builds to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.create-release.outputs.tag_name }}" \
            --repo "${{ github.repository }}" \
            --clobber \
            dist/sabuflix.exe \
            dist/sabuflix-installer.exe \
            dist/sabuflix-windows-bundle.zip

  build-android:
    name: Build Android Package (.apk)
    runs-on: ubuntu-latest
    needs: create-release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Prepare Android APK Artifact
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/sabuflix.apk

      - name: Upload Android APK to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.create-release.outputs.tag_name }}" \
            --repo "${{ github.repository }}" \
            --clobber \
            dist/sabuflix.apk
