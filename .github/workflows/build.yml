name: Sabuflix Multiplatform Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

# Needed so the default GITHUB_TOKEN can create a release and upload assets
# to it (gh release create / gh release upload).
permissions:
  contents: write

jobs:
  # Builds land directly in a draft release instead of Actions artifacts.
  # This uses Releases storage and keeps incomplete builds out of Latest.
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.release.outputs.tag_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine release tag
        id: release
        shell: bash
        run: |
          SAFE_BRANCH=$(printf '%s' "${{ github.ref_name }}" | tr -c 'a-zA-Z0-9._-' '-')
          TAG="build-${SAFE_BRANCH}-${{ github.run_number }}"
          echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.release.outputs.tag_name }}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $TAG already exists, reusing it (re-run of this workflow run)."
            exit 0
          fi

          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "Sabuflix build #${{ github.run_number }} (${{ github.ref_name }})" \
            --notes "Automated multiplatform build from commit ${{ github.sha }} on branch \`${{ github.ref_name }}\`." \
            --target "${{ github.sha }}" \
            --draft

  build-windows:
    name: Build Windows Executable (.exe)
    runs-on: windows-latest
    needs: create-release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Enable Windows desktop build
        run: flutter config --enable-windows-desktop

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Install Packaging Tools (Inno Setup & 7-Zip)
        run: |
          choco install innosetup 7zip.install --no-progress -y

      - name: Package Windows Executables
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path dist

          # 1. Create Inno Setup Single File Installer (.exe)
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" windows/installer.iss

          # 2. Create Zip Bundle
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath dist\sabuflix-windows-bundle.zip

          # 3. Create Self-Extracting Single Executable (.exe)
          $sfxConfig = ";!@Install@!UTF-8!`nTitle=`"Sabuflix`"`nRunProgram=`"sabuflix.exe`"`n;!@InstallEnd@!"
          Set-Content -Path config.txt -Value $sfxConfig -Encoding UTF8
          & "C:\Program Files\7-Zip\7z.exe" a release.7z .\build\windows\x64\runner\Release\*
          cmd /c "copy /b `"C:\Program Files\7-Zip\7z.sfx`" + config.txt + release.7z dist\sabuflix.exe"

      - name: Upload Windows builds to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.create-release.outputs.tag_name }}" \
            --repo "${{ github.repository }}" \
            --clobber \
            dist/sabuflix.exe \
            dist/sabuflix-installer.exe \
            dist/sabuflix-windows-bundle.zip

  build-android:
    name: Build Android (.apk + .aab)
    runs-on: ubuntu-latest
    needs: create-release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Build Android App Bundle
        run: flutter build appbundle --release --no-tree-shake-icons

      - name: Prepare Android APK Artifact
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/sabuflix.apk
          cp build/app/outputs/bundle/release/app-release.aab dist/sabuflix-android.aab

      - name: Upload Android APK to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.create-release.outputs.tag_name }}" \
            --repo "${{ github.repository }}" \
            --clobber \
            dist/sabuflix.apk \
            dist/sabuflix-android.aab

  build-web:
    name: Build Web (.zip)
    runs-on: ubuntu-latest
    needs: create-release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Web Release
        run: flutter build web --release --no-wasm-dry-run

      - name: Package Web Build
        run: |
          mkdir -p dist
          cd build/web
          zip -r ../../dist/sabuflix-web.zip .

      - name: Upload Web build to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.create-release.outputs.tag_name }}" \
            --repo "${{ github.repository }}" \
            --clobber \
            dist/sabuflix-web.zip

  build-linux:
    name: Build Linux (.tar.gz)
    runs-on: ubuntu-latest
    needs: create-release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux Release
        run: flutter build linux --release

      - name: Package Linux Build
        run: |
          mkdir -p dist
          tar -C build/linux/x64/release/bundle -czf dist/sabuflix-linux-x64.tar.gz .

      - name: Upload Linux build to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.create-release.outputs.tag_name }}" \
            --repo "${{ github.repository }}" \
            --clobber \
            dist/sabuflix-linux-x64.tar.gz

  build-macos:
    name: Build macOS (.zip)
    runs-on: macos-latest
    needs: create-release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS Release
        run: flutter build macos --release

      - name: Package macOS Build
        shell: bash
        run: |
          mkdir -p dist
          APP_PATH=$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" dist/sabuflix-macos.zip

      - name: Upload macOS build to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.create-release.outputs.tag_name }}" \
            --repo "${{ github.repository }}" \
            --clobber \
            dist/sabuflix-macos.zip

  build-ios:
    name: Build iOS unsigned (.ipa)
    runs-on: macos-latest
    needs: create-release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS Release without code signing
        run: flutter build ios --release --no-codesign

      - name: Package unsigned iOS app
        shell: bash
        run: |
          mkdir -p dist/Payload
          cp -R build/ios/iphoneos/Runner.app dist/Payload/
          cd dist
          zip -r sabuflix-ios-unsigned.ipa Payload

      - name: Upload iOS build to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.create-release.outputs.tag_name }}" \
            --repo "${{ github.repository }}" \
            --clobber \
            dist/sabuflix-ios-unsigned.ipa

  publish-release:
    name: Publish complete release
    runs-on: ubuntu-latest
    needs:
      - create-release
      - build-windows
      - build-android
      - build-web
      - build-linux
      - build-macos
      - build-ios

    steps:
      - name: Publish release after every build succeeds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.create-release.outputs.tag_name }}"
          PRERELEASE_FLAG=""
          if [ "${{ github.ref_name }}" != "main" ] && [ "${{ github.ref_name }}" != "master" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          gh release edit "$TAG" \
            --repo "${{ github.repository }}" \
            --draft=false \
            $PRERELEASE_FLAG
