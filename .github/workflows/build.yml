name: Sabuflix Multiplatform Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  GH_REPO: ${{ github.repository }}

jobs:
  prepare-release:
    name: Prepare Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Resolve release tag
        id: meta
        run: echo "tag=build-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Create draft release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.meta.outputs.tag }}" \
            --draft \
            --prerelease \
            --target "${{ github.sha }}" \
            --title "Sabuflix build ${{ github.run_number }}" \
            --notes "Build automático a partir de ${GITHUB_SHA:0:7} (${GITHUB_REF_NAME})."

  build-windows:
    name: Build Windows Executable (.exe)
    runs-on: windows-latest
    needs: prepare-release
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Enable Windows desktop build
        run: flutter config --enable-windows-desktop

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Install Packaging Tools (Inno Setup & 7-Zip)
        run: |
          choco install innosetup 7zip.install --no-progress -y

      - name: Package Windows Executables
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path dist

          # 1. Create Inno Setup Single File Installer (.exe)
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" windows/installer.iss

          # 2. Create Zip Bundle
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath dist\sabuflix-windows-bundle.zip

          # 3. Create Self-Extracting Single Executable (.exe)
          $sfxConfig = ";!@Install@!UTF-8!`nTitle=`"Sabuflix`"`nRunProgram=`"sabuflix.exe`"`n;!@InstallEnd@!"
          Set-Content -Path config.txt -Value $sfxConfig -Encoding UTF8
          & "C:\Program Files\7-Zip\7z.exe" a release.7z .\build\windows\x64\runner\Release\*
          cmd /c "copy /b `"C:\Program Files\7-Zip\7z.sfx`" + config.txt + release.7z dist\sabuflix.exe"

      - name: Publish Windows assets to release
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ needs.prepare-release.outputs.tag }}" \
            dist/sabuflix.exe \
            dist/sabuflix-installer.exe \
            dist/sabuflix-windows-bundle.zip \
            --clobber

  build-android:
    name: Build Android Package (.apk)
    runs-on: ubuntu-latest
    needs: prepare-release
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Prepare Android APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/sabuflix.apk

      - name: Publish Android asset to release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ needs.prepare-release.outputs.tag }}" \
            dist/sabuflix.apk \
            --clobber

  publish-release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [ prepare-release, build-windows, build-android ]
    if: github.event_name != 'pull_request'
    permissions:
      contents: write

    steps:
      - name: Mark release as published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "${{ needs.prepare-release.outputs.tag }}" --draft=false
