<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Sabuflix — sua central oficial para descobrir, organizar e assistir mídia.">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Sabuflix">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Sabuflix</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #000; }
    #sabu-loading {
      position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center;
      background: #000; color: #fff; font: 800 18px/1 system-ui, sans-serif;
      letter-spacing: -.7px; transition: opacity .28s ease;
    }
    #sabu-loading div { display: flex; flex-direction: column; align-items: center; gap: 18px; }
    #sabu-loading img { width: 72px; height: 72px; border-radius: 18px; }
    #sabu-loading span { color: #777; font: 600 11px/1 system-ui, sans-serif; letter-spacing: 1.8px; }
  </style>
</head>
<body>
  <div id="sabu-loading" role="status" aria-label="Carregando Sabuflix">
    <div><img src="icons/Icon-192.png" alt=""><strong>SABUFLIX</strong><span>CARREGANDO</span></div>
  </div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      const loader = document.getElementById('sabu-loading');
      if (!loader) return;
      loader.style.opacity = '0';
      setTimeout(() => loader.remove(), 300);
    });
  </script>
</body>
</html>
